name: fallacy-finetune
channels:
  - conda-forge
  - nvidia
  - pytorch
dependencies:
  - python=3.10
  - pytorch::pytorch        # Forces the official PyTorch channel
  - pytorch::torchvision    # Forces the official PyTorch channel
  - pytorch::torchaudio     # Forces the official PyTorch channel
  - pytorch-cuda=12.4
  - matplotlib
  - pip
  - pip:
      - transformers==5.17.0
      - peft>=0.10.0
      - datasets==5.0.1
      - accelerate==1.15.0
      - bitsandbytes==0.50.2
      - tokenizers==0.23.1
      - safetensors==0.8.0
      - evaluate==0.4.6
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - wandb==0.30.0