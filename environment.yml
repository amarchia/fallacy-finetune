# environment.yml
name: fallacy-finetune
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch::pytorch>=2.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=11.8
  - conda-forge::transformers
  - conda-forge::datasets
  - conda-forge::accelerate
  - conda-forge::tokenizers
  - conda-forge::numpy
  - conda-forge::pandas
  - conda-forge::scikit-learn
  - pip
  - pip:
    - huggingface_hub
    - tqdm
    - wandb  # Optional: for logging
    - datasets
    - evaluate
    - accelerate
    - bitsandbytes  # Optional: for 4-bit quantization
